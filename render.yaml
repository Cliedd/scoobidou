services:
  - type: web
    name: passportly
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.19.1
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: IMPORT_TOKEN
        sync: false
      - key: API_KEY_ADMIN_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
  - type: cron
    name: passportly-monitor
    runtime: node
    plan: starter
    branch: main
    schedule: "15 */6 * * *"
    buildCommand: npm install
    startCommand: npm run monitor:run
    envVars:
      - key: NODE_VERSION
        value: 18.19.1
      - key: DATABASE_URL
        sync: false
      - key: MONITOR_SOURCES_JSON
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
